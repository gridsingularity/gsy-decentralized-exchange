[package]
name = "gsy-offchain-storage"
version = "0.1.0"
authors = ["Grid Singularity <info@gridsingularity.com>"]
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "gsy-offchain-storage"

[dependencies]
primitives = { path = "../primitives" }
gsy-ethers-listener = { path = "../gsy-ethers-listener" }
anyhow = "1"
actix-web = "4.5.1"
chrono = { version = "0.4.37", features = ["serde"] }
config = "0.15.18"
dotenv = "0.15.0"
futures = "0.3.30"
mongodb = "3.3.0"
serde = { version = "1.0", features = ["derive"] }
tokio_schedule = "0.3.2"
serde_json = { version = "1.0"}
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.11", features = ["json"] }
tracing-actix-web = "0.7"
ethers = { version = "2.0", default-features = false }
hex = "0.4"
async-trait = "0.1"
uuid = { version = "1.12.1", features = ["v4"] }
tracing = "0.1.44"
wiremock = "0.6.5"

[dev-dependencies]
once_cell = "1"
uuid = "1"
ethers = { version = "2.0", features = ["ws", "abigen", "rustls", "solc"] }
tempfile = "3.10"
