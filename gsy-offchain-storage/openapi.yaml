                    Note that the disposal itself is **not** visible in this API: the sale
                    is recorded by the issuing party through `attribute_mode`,
                    `claim_permitted` and `permitted_claim_text_id`, none of which is
                    carried here. This payload is therefore identical in shape and, apart
                    from the measurement it derives from, indistinguishable from Annex
                    A.6.1 above. The distinction is drawn by the issuing party, on the
                    record it issues from this data.
                  value:
                    - identity:
                        record_type: local_origin_record
                        site_id: ch-aem-lic-goo-poc
                      time_and_quantity:
                        interval_start: '2026-05-14T13:00:00+02:00'
