                      trade_and_delivery:
                        trade_reference:
                          - 3f7c1e9a-5b2d-4c81-9f0a-6d4e2b8a1c37
                          - c81a4d6b-9e73-4f25-b0c8-27a5f1d93e60
                        trade_hash:
                          - '0x3c9e11a4f8b27d5e6c0193ab74df82e5b1c6a09f3d7e48521bc9fa06e37d4b81'
                          - '0x77ab02c5d9e1483f7620ba5cd8e094172f3a6b8d05e9c71426fd83a09b5e7c12'
                        trade_status_at_issuance: delivery_verified
                        delivery_verification_reference: exec:2026-05-14:slot50
                attributeTransferredToThirdParty:
                  summary: Attribute transferred to a third party, no claim carried (Annex A.6.2)
                  description: |
                    The volume was generated and delivered locally but the attribute was
                    sold, so the record is issued for traceability and carries no
                    environmental claim.

                    Shown in full rather than abbreviated, because the shape is fixed: the
                    attributes that do not apply to this record are present and `null`, and
                    that is what a consumer receives. Contrast `support_scheme_status` and
