                          value: 27.29
                          unit: kW
                      consumption_asset:
                        consumption_asset_id: LIC01PV
                        asset_registry_reference: ch-go-registry:asset:0002871
                        metering_point_id: CH1018601234500000000000000000001
                        asset_class: MeteringPoint
                      location:
                        municipality_code: '5226'
                        grid_operator_id: AEM
                        grid_level: 7
                        community_id_origin: LugaggiaInnovationCommunity
                        community_id_consumption: LugaggiaInnovationCommunity
                        delivery_scope: intra_community
                      measurement_provenance:
                        measurement_id: LIC:LIC01:e_generation
                        measuring_sensor_id: LIC01SmartMeter
                        property_measured: measurement#active_energy
                        flow_direction: export
                        data_provider_id: did:example:aem-metering
                        data_completeness: complete
                        data_record_class: measurement
                        source_of_record: operator_validated
                        measurement_recorded_at: 1778761200
                      attribute_provenance:
