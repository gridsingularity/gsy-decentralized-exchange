openapi: 3.0.3
info:
  title: GSY DEX Off-Chain Storage API
  version: 0.1.0
  description: |
    HTTP API of the GSY DEX off-chain storage service (actix-web), which persists
    orders, trades, market topologies, measurements and forecasts to MongoDB
    (or an in-memory backend for tests) and exposes read endpoints for them.

    **Authentication is not yet implemented.** All endpoints are currently
    unauthenticated; JWT-based authentication is planned to be added globally
    at a later stage.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: system
    description: Service health and diagnostics
  - name: orders
    description: Bid and offer order storage
  - name: trades
    description: Trade storage
  - name: markets
    description: Market topology storage
  - name: profiles
    description: Asset measurement and forecast profiles
  - name: analytics
    description: Aggregated time-series derived from stored data
paths:
  /health_check:
    get:
      tags: [system]
      summary: Health check
      description: Returns 200 with an empty body when the service is up.
      operationId: healthCheck
      responses:
        '200':
          description: Service is up. Empty response body.
  /orders:
    post:
      tags: [orders]
      summary: Insert SCALE-encoded orders from the gsy-node
      description: |
        Accepts a JSON array of unsigned bytes (integers 0-255) that is the
        SCALE encoding of a `Vec<Order>` as produced by the gsy-node runtime.
        The service decodes the bytes and converts each order to the
        `DbOrderSchema` document format before insertion. For submitting
        already-normalized JSON documents use `POST /orders-normalized`.
      operationId: postOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleEncodedBytes'
      responses:
        '200':
          description: Orders inserted. Map of array index to inserted document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertedIdsMap'
        '400':
          description: Malformed JSON body (not an array of integers 0-255).
        '500':
          description: Database insertion failed. Empty response body.
    get:
      tags: [orders]
      summary: List or filter stored orders
      description: |
        Returns all stored orders when no query parameter is provided,
        otherwise filters by market id and/or an inclusive `time_slot` window.
      operationId: getOrders
      parameters:
        - name: market_id
          in: query
          required: false
          description: Only return orders belonging to this market id.
          schema:
            type: string
        - name: start_time
          in: query
          required: false
          description: Lower bound (inclusive) for the order `time_slot`, in unix seconds.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: end_time
          in: query
          required: false
          description: Upper bound (inclusive) for the order `time_slot`, in unix seconds.
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: Matching orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DbOrderSchema'
        '400':
          description: Query parameter has an invalid type (e.g. non-integer time bound).
        '500':
          description: Database query failed. Empty response body.
  /orders-normalized:
    post:
      tags: [orders]
      summary: Insert normalized order documents
      description: Inserts a JSON array of `DbOrderSchema` documents as-is.
      operationId: postNormalizedOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/DbOrderSchema'
      responses:
        '200':
          description: Orders inserted. Map of array index to inserted document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertedIdsMap'
        '400':
          description: Malformed JSON body (does not deserialize to an array of DbOrderSchema).
        '500':
          description: Database insertion failed. Empty response body.
  /trades:
    post:
      tags: [trades]
      summary: Insert SCALE-encoded trades from the gsy-node
      description: |
        Accepts a JSON array of unsigned bytes (integers 0-255) that is the
        SCALE encoding of a `Vec<Trade>` as produced by the gsy-node runtime.
        The service decodes the bytes, converts each trade to the
        `TradeSchema` document format, marks the matched bid/offer orders of
        each trade as executed, and inserts the trades. For submitting
        already-normalized JSON documents use `POST /trades-normalized`.
      operationId: postTrades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleEncodedBytes'
      responses:
        '200':
          description: Trades inserted. Map of array index to inserted document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertedIdsMap'
        '400':
          description: Malformed JSON body (not an array of integers 0-255).
        '500':
          description: Database insertion failed. Empty response body.
    get:
      tags: [trades]
      summary: List or filter stored trades
      description: Filters trades by market id, execution status and/or an inclusive `time_slot` window; all parameters are optional.
      operationId: getTrades
      parameters:
        - name: market_id
          in: query
          required: false
          description: Only return trades belonging to this market id.
          schema:
            type: string
        - name: start_time
          in: query
          required: false
          description: Lower bound (inclusive) for the trade `time_slot`, in unix seconds.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: end_time
          in: query
          required: false
          description: Upper bound (inclusive) for the trade `time_slot`, in unix seconds.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: status
          in: query
          required: false
          description: >
            Only return trades in this lifecycle status. Use `Settled` to list trades still
            pending execution, and `Executed`/`Penalized` for trades the execution engine has
            already judged.
          schema:
            $ref: '#/components/schemas/TradeStatus'
      responses:
        '200':
          description: Matching trades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeSchema'
        '400':
          description: Query parameter has an invalid type (e.g. non-integer time bound).
        '500':
          description: Database query failed. Empty response body.
  /trades-normalized:
    post:
      tags: [trades]
      summary: Insert normalized trade documents
      description: Inserts a JSON array of `TradeSchema` documents as-is.
      operationId: postNormalizedTrades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TradeSchema'
      responses:
        '200':
          description: Trades inserted. Map of array index to inserted document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsertedIdsMap'
        '400':
          description: Malformed JSON body (does not deserialize to an array of TradeSchema).
        '500':
          description: Database insertion failed. Empty response body.
  /traded-energy:
    get:
      tags: [analytics]
      summary: Traded energy time-series for an area
      description: |
        Aggregates the `selected_energy` of all trades in which the given area
        participates (on the bid or the offer side) per `time_slot`, and returns
        the resulting time-series sorted ascending by timestamp. The optional
        time bounds restrict the trade `time_slot` window (inclusive).
      operationId: getTradedEnergy
      parameters:
        - name: id
          in: query
          required: true
          description: Area UUID whose traded energy is aggregated.
          schema:
            type: string
        - name: start_time
          in: query
          required: false
          description: Lower bound (inclusive) for the trade `time_slot`, in unix seconds.
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: end_time
          in: query
          required: false
          description: Upper bound (inclusive) for the trade `time_slot`, in unix seconds.
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: Aggregated traded energy per time slot (empty series when no trades match).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradedEnergyResponse'
        '400':
          description: Missing required `id` parameter or invalid parameter type.
        '500':
          description: Database query failed. Empty response body.
  /guarantees-of-origin-measurements:
    get:
      tags: [analytics]
      summary: Energy share digital certificate records
      description: |
        Returns the energy share digital certificate records of the pilot site,
        as specified by D6.6 Annex A (*Energy Share Digital Certificate Data
        Schema and Pilot Configuration*). Each entry is one record covering one
        fifteen-minute interval, either a `local_origin_record` issued against
        metered generation of a production asset, or a
        `flexibility_activation_record` issued against a metered dispatch of a
        storage or controllable thermal asset.

        `start_time`/`end_time` bound **when the trade was validated** — the
        moment the execution engine's verdict promoted it to `Executed` — and
        not the delivery interval the energy flowed in. The two differ, and
        by an amount that is not fixed: metering arrives after the interval it
        describes, so a trade delivered in one interval may only be validated
        much later. A window over delivery time would close over slots that
        were still awaiting a verdict and never return them once they arrived.
        Windowing on validation time cannot lose a record that way, because a
        record does not exist before its verdict. `Executed` is terminal, so
        the value being filtered on never changes again once set.

        A record's delivery interval remains available as `interval_start` and
        `source_slot_timestamp`; it is simply not what the query filters on.

        Every response object has the same set of keys for a given
        `record_type`. An attribute that does not apply is present and `null`
        rather than omitted; array attributes are present and empty. See
        `CertificateRecord`.

        Under the scheme, records are appended and never amended; a correction
        is effected by issuing a replacement record, the replaced record
        acquiring a terminal status and being retained. See `CertificateRecord` 
        for the full list of issuance attributes that are consequently absent 
        from this API.
      operationId: getGuaranteesOfOrigin
      parameters:
        - name: start_time
          in: query
          required: true
          description: |
            Lower bound (inclusive), in unix seconds, on **when the trade was
            validated** — the moment its status changed to `Executed`.

            This windows on validation time, not on delivery time. Metering
            arrives after the interval it describes and by a delay that is not
            fixed, so a trade for a given delivery slot may only be validated
            minutes or days after that slot ended. A window over delivery time
            would therefore advance past slots still awaiting their verdict and
            never return them; a window over validation time cannot, because a
            record only exists once the verdict is in.

            `Executed` is terminal, so the value this filters on never moves
            again once set, and a query over a closed window is reproducible.

            Mandatory: without a lower bound the query would scan every trade
            ever settled.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: end_time
          in: query
          required: false
          description: |
            Upper bound (inclusive) on validation time, as `start_time` is.
            Omit for "everything validated since `start_time`".

            Note that both bounds are inclusive, so a consumer stepping through
            consecutive windows should advance `start_time` past the previous
            `end_time` rather than reusing it, or it will receive the boundary
            records twice.
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Matching certificate records (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CertificateRecord'
              examples:
                localOriginIntraCommunityRetained:
                  summary: Local origin record, intra-community, attribute retained (Annex A.6.1)
                  description: |
                    Every attribute of the schema is shown populated so that the type of
                    each is illustrated, including the conditional (C) and reserved (R)
                    attributes. On a real record the conditions of Annex A.5 apply and
                    several of these would be `null` instead: `support_scheme_status` is
                    reserved and not populated in the proof of concept, and
                    `loss_adjustment` carries a value only where
                    `storage_mediated_flag` is true. The keys are present either way — see
                    the fixed-shape note on `CertificateRecord`.

                    The issuance, disposal and retirement attributes of Annex A.6.1 are
                    absent throughout, as described on `CertificateRecord`: this service
                    does not issue records, and so neither disposes of the environmental
                    attribute nor retires it.
                  value:
                    - identity:
                        record_type: local_origin_record
                        site_id: ch-aem-lic-goo-poc
                      time_and_quantity:
                        interval_start: '2026-05-14T12:30:00+02:00'
                        interval_end: '2026-05-14T12:45:00+02:00'
                        interval_duration_s: 900
                        source_slot_timestamp: 1778754600
                        energy_quantity: 3.85
                        energy_unit: kWh
                        rounding_rule: half_up_2dp
                        loss_adjustment: 0.00
                      production_asset:
                        production_asset_id: LIC01PV
                        asset_registry_reference: ch-go-registry:asset:0002871
                        metering_point_id: CH1018601234500000000000000000001
                        asset_class: PV
