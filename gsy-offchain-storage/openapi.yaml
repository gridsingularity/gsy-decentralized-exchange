openapi: 3.1.0
info:
  title: GSY DEX Off-Chain Storage API
  version: "2.0.0"
  description: |
    REST API of the GSY DEX Off-Chain Storage service. The schemas mirror the
    Rust types defined in `primitives/src/db_api_schema/`, except for
    communities, sites and facilities, which use the DTOs in
    `primitives/src/ewds/dto.rs`. They are grouped by the storage areas of D3.2:

      * §5.1 Grid Topology and Market Storage
      * §5.2 Measurements Storage
      * §5.3 Trades and Market Storage
      * §5.4 Order Book Storage

    `POST /orders` and `POST /orders-normalized` accept the same EWDS JSON
    order payload and insert new database records without replacing existing IDs. They are not used by
    the E2E scenarios or production order lifecycle, which submits orders
    on-chain and indexes the resulting events. Their access policy remains
    to be clarified. Trade insertion endpoints do not update referenced orders.
    Order imports normalize UUIDv4 order and market IDs
    to lowercase UUID text. createdBy is the original off-chain owner ID. Invalid IDs return 400; duplicate
    IDs in the batch or storage return 409. Batches are not transactional under
    concurrent writes. Listener events remain authoritative and can replace imports.
    Trade imports normalize entity IDs by the same UUIDv4 rule and preserve off-chain parties;
    optional residual IDs must be null or UUIDv4. They reject invalid IDs with 400 and
    duplicate canonical trade IDs with 409, without updating orders or emitting events.
    Reads of known-incomplete chain projections return 500 while unresolved actor
    mappings or prerequisite events are pending, never a partial book or trade set.
  license:
    name: GPL-3.0-or-later
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Order Book
    description: D3.2 §5.4
  - name: Trades & Market
    description: D3.2 §5.3
  - name: Measurements
    description: D3.2 §5.2
  - name: Grid Topology
    description: D3.2 §5.1
  - name: Guarantees of Origin
    description: local_origin_record certificates, derived on request

paths:
  /health_check:
    get:
      tags: [Health]
      summary: Liveness probe.
      responses:
        "200":
          description: Service is up.

  /orders-normalized:
    post:
      tags: [Order Book]
      summary: Import new orders without replacing existing records.
      description: |
        Alias of POST /orders. Uses original off-chain owner IDs in
        createdBy; does not submit on-chain. Preferred partners
        remain off-chain IDs. Validation and known-conflict checks precede writes,
        but batches are not transactional. New records retain caller-supplied statuses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EwdsOrderDto"
      responses:
        "200":
          description: Inserted order IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertedIds"
        "400":
          description: Invalid order payload or identifier.
        "409":
          description: Duplicate canonical order ID in the batch or existing storage.
        "500":
          $ref: "#/components/responses/InternalError"

  /orders:
    post:
      tags: [Order Book]
      summary: Import new orders without replacing existing records.
      requestBody:
        $ref: "#/paths/~1orders-normalized/post/requestBody"
      responses:
        "200":
          $ref: "#/paths/~1orders-normalized/post/responses/200"
        "400":
          $ref: "#/paths/~1orders-normalized/post/responses/400"
        "409":
          $ref: "#/paths/~1orders-normalized/post/responses/409"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Order Book]
      summary: List orders, optionally filtered by market and time window.
      parameters:
        - { $ref: "#/components/parameters/MarketIdQuery" }
        - { $ref: "#/components/parameters/StartTimeQuery" }
        - { $ref: "#/components/parameters/EndTimeQuery" }
      responses:
        "200":
          description: Matching orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EwdsOrderDto"
        "400":
          description: Invalid market ID or time range.
        "500":
          $ref: "#/components/responses/InternalError"

  /flexibility-orders:
    post:
      tags: [Order Book]
      summary: Insert flexibility orders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/FlexibilityOrderSchema"
      responses:
        "200":
          description: Inserted flexibility-order IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertedIds"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Order Book]
      summary: List all flexibility orders.
      responses:
        "200":
          description: All flexibility orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlexibilityOrderSchema"
        "500":
          $ref: "#/components/responses/InternalError"

  /tariffs:
    post:
      tags: [Order Book]
      summary: Persist a tariff definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TariffSchema"
      responses:
        "200":
          description: Saved tariff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffSchema"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Order Book]
      summary: List all tariffs.
      responses:
        "200":
          description: All tariffs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TariffSchema"
        "500":
          $ref: "#/components/responses/InternalError"

  /trades-normalized:
    post:
      tags: [Trades & Market]
      summary: Import trades (alias of POST /trades).
      description: |
        Imports are insert-only and do not update orders or publish lifecycle notifications.
        IDs accept hyphenated UUIDv4 in either letter case and are stored as lowercase UUID text. All input is
        validated before writes; known duplicates return 409. Concurrent batches are not transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EwdsTradeDto"
      responses:
        "200":
          description: Inserted trade IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertedIds"
        "500":
          $ref: "#/components/responses/InternalError"
        "400":
          description: Invalid trade payload or unsupported trade status.
        "409":
          description: Duplicate canonical trade ID in the batch or existing storage.

  /trades:
    post:
      tags: [Trades & Market]
      summary: Import trades using EWDS JSON.
      description: |
        Imports are insert-only and do not update orders or publish lifecycle notifications.
        IDs accept hyphenated UUIDv4 in either letter case and are stored as lowercase UUID text. All input is
        validated before writes; known duplicates return 409. Concurrent batches are not transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/EwdsTradeDto"
      responses:
        "200":
          description: Inserted trade IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertedIds"
        "400":
          description: Invalid trade payload or unsupported trade status.
        "409":
          description: Duplicate canonical trade ID in the batch or existing storage.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Trades & Market]
      summary: List trade snapshots for a market or delivery time window.
      description: |
        Returns all lifecycle statuses using the same DTO as EWDS trades.query.
        Supply market_id or both start_time and end_time (at most one day).
        Time ranges filter market delivery start times, not status-change timestamps.
      parameters:
        - in: query
          name: market_id
          description: Hyphenated UUIDv4 market ID in either letter case; no surrounding whitespace.
          schema: { type: string }
        - { $ref: "#/components/parameters/StartTimeQuery" }
        - { $ref: "#/components/parameters/EndTimeQuery" }
      responses:
        "200":
          description: Matching trades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EwdsTradeDto"
        "500":
          $ref: "#/components/responses/InternalError"
        "400":
          description: Missing or invalid query range.

  /market:
    get:
      tags: [Trades & Market]
      summary: Look up a market by ID.
      parameters:
        - in: query
          name: market_id
          required: true
          description: Hyphenated UUIDv4 in either letter case; no surrounding whitespace.
          schema: { type: string }
      responses:
        "200":
          description: Market matching the given ID, with a lowercase UUIDv4 market_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSchema"
        "400":
          description: Invalid or nil market ID.
        "404":
          description: No matching market.
        "500":
          $ref: "#/components/responses/InternalError"

  /markets:
    post:
      tags: [Trades & Market]
      summary: Create or update a market by its canonical ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketSchema"
      responses:
        "200":
          description: Saved market with a canonical market ID and the exact off-chain community ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSchema"
        "400":
          description: Invalid or nil market ID, or empty or padded community ID.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Trades & Market]
      summary: List markets by market ID, community ID or opening time.
      parameters:
        - { $ref: "#/components/parameters/MarketIdQuery" }
        - in: query
          name: community_id
          required: false
          description: Nonempty, unpadded opaque off-chain community ID; exact and case-sensitive.
          schema: { type: string }
        - { $ref: "#/components/parameters/StartTimeQuery" }
        - { $ref: "#/components/parameters/EndTimeQuery" }
      responses:
        "200":
          description: Matching markets with canonical market IDs and exact off-chain community IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSchema"
        "400":
          description: Invalid or nil market ID, or empty or padded community ID.
        "404":
          description: No matching markets.
        "500":
          $ref: "#/components/responses/InternalError"

  /clearing-results:
    post:
      tags: [Trades & Market]
      summary: Persist a clearing result for a market.
      description: Accepts hyphenated UUIDv4 marketId in either letter case and normalizes it to lowercase UUID text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EwdsClearingResultDto"
      responses:
        "200":
          description: Saved clearing result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwdsClearingResultDto"
        "400":
          description: Invalid clearing result or malformed/nil market ID.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Trades & Market]
      summary: List clearing results for a market.
      parameters:
        - in: query
          name: market_id
          required: true
          description: Hyphenated UUIDv4 market ID in either letter case; no surrounding whitespace.
          schema: { type: string }
      responses:
        "200":
          description: Clearing results for the market.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EwdsClearingResultDto"
        "400":
          description: Invalid market ID.
        "500":
          $ref: "#/components/responses/InternalError"

  /market-roles:
    post:
      tags: [Trades & Market]
      summary: Define a market role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketRoleSchema"
      responses:
        "200":
          description: Saved market role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketRoleSchema"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Trades & Market]
      summary: List all market roles.
      responses:
        "200":
          description: All market roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketRoleSchema"
        "500":
          $ref: "#/components/responses/InternalError"

  /measurement-points:
    post:
      tags: [Measurements]
      summary: Register measurement / forecast points.
      description: Facility references in asset_name and client-supplied measurement_id values are preserved exactly. datasource_name is generic metadata, not a validated actor ID; all labels (including empty, padded and UUID-shaped strings) and missing values are preserved exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/MeasurementPointSchema"
      responses:
        "200":
          description: Inserted measurement-point IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertedIds"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Measurements]
      summary: List measurement points, optionally filtered by asset and type.
      parameters:
        - in: query
          name: asset_name
          required: false
          schema: { type: string }
        - in: query
          name: type
          required: false
          schema:
            $ref: "#/components/schemas/MeasurementPointType"
      responses:
        "200":
          description: Matching measurement points.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeasurementPointSchema"
        "500":
          $ref: "#/components/responses/InternalError"

  /timeseries:
    post:
      tags: [Measurements]
      summary: Append timeseries values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/TimeseriesSchema"
      responses:
        "200":
          description: Inserted timeseries IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertedIds"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Measurements]
      summary: Query timeseries values for a measurement point.
      parameters:
        - in: query
          name: measurement_point
          required: false
          schema: { type: string }
        - { $ref: "#/components/parameters/StartTimeQuery" }
        - { $ref: "#/components/parameters/EndTimeQuery" }
      responses:
        "200":
          description: Matching timeseries values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeseriesSchema"
        "500":
          $ref: "#/components/responses/InternalError"

  /guarantees-of-origin:
    get:
      tags: [Guarantees of Origin]
      summary: Derive local_origin_record certificates from Executed trades.
      description: |
        Returns one `local_origin_record` per trade that reached `executed` within the
        window, whose seller facility has a PV asset, is net exporting at the delivery
        slot, and whose sale is fully covered by that net export (time priority over all
        executed sales of the facility in the slot). The window is on **verdict time**
        (`status_updated_at`, Unix seconds of the trade's last status change, stored on
        the trade document), not delivery slot; trades without `status_updated_at` are
        never returned. Also available over EWDS as `guarantees_of_origin.query`.
      parameters:
        - in: query
          name: start_time
          required: true
          description: Lower bound (inclusive) on the verdict time, Unix seconds.
          schema: { type: integer, format: int64, minimum: 0 }
        - in: query
          name: end_time
          required: false
          description: |
            Upper bound (exclusive) on the verdict time, Unix seconds. Defaults to
            `start_time + d`, where `d` is the pilot interval (`GOO_INTERVAL_DURATION_S`,
            default 900); must satisfy `start_time < end_time <= start_time + d`.
            Back-to-back windows `[t, t+d)`, `[t+d, t+2d)` never overlap.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Certificates, deterministically ordered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalOriginRecord"
        "400":
          description: Missing `start_time`, `end_time <= start_time`, or a window over one interval (default 900 s).
        "500":
          $ref: "#/components/responses/InternalError"

  /assets:
    post:
      tags: [Grid Topology]
      summary: Register assets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AssetSchema"
      responses:
        "200":
          description: Inserted asset IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertedIds"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Grid Topology]
      summary: List assets, or look up by UUID / facility.
      description: |
        With no query parameters, returns all assets. With `uuid` set, returns a
        single asset object (or 404). With `facility_name` set, returns the list
        of assets belonging to that facility.
      parameters:
        - in: query
          name: uuid
          required: false
          schema: { type: string }
        - in: query
          name: facility_name
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Asset, list of assets, or list of assets for a facility.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AssetSchema"
                  - type: array
                    items:
                      $ref: "#/components/schemas/AssetSchema"
        "404":
          description: No asset found for the supplied UUID.
        "500":
          $ref: "#/components/responses/InternalError"

  /pilot-sites:
    post:
      tags: [Grid Topology]
      summary: Register a pilot site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotSiteSchema"
      responses:
        "200":
          description: Saved pilot site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotSiteSchema"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Grid Topology]
      summary: List all pilot sites.
      responses:
        "200":
          description: All pilot sites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PilotSiteSchema"
        "500":
          $ref: "#/components/responses/InternalError"

  /communities:
    post:
      tags: [Grid Topology]
      summary: Store a version of an energy community.
      description: |
        Actor IDs are nonempty, unpadded, case-sensitive strings, including UUID-shaped strings.
        Registers the community mapping before writing; mapping failures prevent ingestion.
        Stores the energy community as a new version, unless it equals the latest version of its
        `communityId` apart from `validFrom`. Older versions are kept for audit only.
        `validFrom` is set to the time the request arrives; a value sent is ignored.
        Send the full energy community with `validUntil` to delete it from that time on, and again
        without `validUntil` to bring it back.
        Deleting it does not delete its sites; delete each of them too. Also available over EWDS as
        `community.event`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EwdsCommunityDto"
      responses:
        "200":
          description: The stored version, or the latest one if nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwdsCommunityDto"
        "400":
          description: Invalid body, actor ID, site reference, `validFrom` or `validUntil`.
        "409":
          description: A valid energy community with another `communityId` already uses `communityName`.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Grid Topology]
      summary: List the energy communities.
      description: |
        The latest version of each energy community, ordered by `communityId`, without deleted ones.
      responses:
        "200":
          description: The latest energy communities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EwdsCommunityDto"
        "500":
          $ref: "#/components/responses/InternalError"

  /sites:
    post:
      tags: [Grid Topology]
      summary: Store a version of a site.
      description: |
        Site IDs and facility references are exact, nonempty, unpadded actor IDs. Identical references
        are deduplicated. Registers the site ID mapping before writing; names are unchanged.
        Stores the site as a new version, unless it equals the latest version of its
        `site_id` apart from `valid_from`. Older versions are kept for audit only.
        `valid_from` is set to the time the request arrives; a value sent is ignored.
        Send the complete facilities list: facilities omitted from the new version lose their
        site membership.
        Send the full site with `valid_until` to delete it from that time on, and again
        without `valid_until` to bring it back.
        Deleting it does not delete its facilities; delete each of them too. Also available over EWDS as
        `site.event`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EwdsSiteDto"
      responses:
        "200":
          description: The stored version, or the latest one if nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwdsSiteDto"
        "400":
          description: Invalid body, actor ID, reference, `valid_from` or `valid_until`.
        "409":
          description: A valid site with another `site_id` already uses `site_name`.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Grid Topology]
      summary: List the sites.
      description: |
        The latest version of each site, ordered by `site_id`, without deleted ones.
      responses:
        "200":
          description: The latest sites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EwdsSiteDto"
        "500":
          $ref: "#/components/responses/InternalError"

  /facilities:
    post:
      tags: [Grid Topology]
      summary: Store a version of a facility.
      description: |
        Facility, owner and site IDs are exact, nonempty, unpadded actor IDs. Registers facility and
        owner mappings before writing; mapping failures prevent ingestion.
        Stores the facility as a new version, unless it equals the latest version of its
        `facility_id` apart from `valid_from`. Older versions are kept for audit only.
        `valid_from` is set to the time the request arrives; a value sent is ignored.
        Send the full facility with `valid_until` to delete it from that time on, and again
        without `valid_until` to bring it back. Also available over EWDS as
        `facility.event`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EwdsFacilityDto"
      responses:
        "200":
          description: The stored version, or the latest one if nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EwdsFacilityDto"
        "400":
          description: Invalid body, actor ID, reference, `valid_from` or `valid_until`.
        "409":
          description: A valid facility with another `facility_id` already uses `facility_name`.
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Grid Topology]
      summary: List the facilities.
      description: |
        The latest version of each facility, ordered by `facility_id`, without deleted ones.
      responses:
        "200":
          description: The latest facilities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EwdsFacilityDto"
        "500":
          $ref: "#/components/responses/InternalError"

  /ids:
    post:
      tags: [Grid Topology]
      summary: Get or create an off-chain to on-chain identity mapping.
      description: |
        Nonempty, unpadded actor IDs are preserved exactly, including UUID-shaped
        and hex-shaped strings. On-chain IDs use keyed Blake2b-16 with the shared
        ACTOR_ID_HASH_KEY. A mapping does not establish facility existence or eligibility.
      parameters:
        - in: query
          name: offchain_id
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Canonical off-chain identity and its bytes16 hash.
          content:
            application/json:
              schema:
                type: object
                required: [offchain_id, onchain_id, creation_time]
                properties:
                  offchain_id: { type: string }
                  onchain_id: { type: string, pattern: '^0x[0-9a-f]{32}$' }
                  creation_time: { type: integer, format: uint64 }
        "400": { description: Empty or whitespace-padded identity. }
        "500": { $ref: "#/components/responses/InternalError" }

  /measurements:
    post:
      tags: [Measurements]
      summary: Upsert measurement profiles and their values.
      description: |
        Facility and community identities are nonempty, unpadded opaque strings,
        preserved exactly and case-sensitive, including UUID-like spellings.
        The whole payload is validated before writing; writes are not transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/MeasurementProfile" }
      responses:
        "200":
          description: Written timeseries IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsertedIds" }
        "400": { description: Invalid profile or identifier. }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Measurements]
      summary: Read measurement profiles using exact identity filters.
      description: |
        Filters combine. Aliases facilityId/areaUuid, communityUuid, startTime and
        endTime are supported; send only one spelling per field. Stored points
        without datasource metadata return an empty community_uuid.
      parameters:
        - { in: query, name: facility_id, schema: { type: string } }
        - { in: query, name: community_uuid, schema: { type: string }, description: "Nonempty, unpadded opaque community ID; exact and case-sensitive." }
        - { in: query, name: start_time, schema: { type: string, format: date-time } }
        - { in: query, name: end_time, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Matching measurements; creation_time is reconstructed from the timeseries timestamp.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementProfile" }
        "400": { description: Invalid filter or time range. }
        "500": { $ref: "#/components/responses/InternalError" }

  /forecasts:
    post:
      tags: [Measurements]
      summary: Upsert forecast profiles and their values.
      description: Uses the same identifier validation and non-transactional write behavior as POST /measurements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ForecastProfile" }
      responses:
        "200":
          description: Written timeseries IDs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsertedIds" }
        "400": { description: Invalid profile or identifier. }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Measurements]
      summary: Read forecast profiles using exact identity filters.
      description: Same filters and aliases as GET /measurements; reconstructed confidence is 1.0.
      parameters:
        - { in: query, name: facility_id, schema: { type: string } }
        - { in: query, name: community_uuid, schema: { type: string }, description: "Nonempty, unpadded opaque community ID; exact and case-sensitive." }
        - { in: query, name: start_time, schema: { type: string, format: date-time } }
        - { in: query, name: end_time, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Matching forecasts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ForecastProfile" }
        "400": { description: Invalid filter or time range. }
        "500": { $ref: "#/components/responses/InternalError" }

  /facilities/validate:
    post:
      tags: [Grid Topology]
      summary: Validate facility participation in markets without writing records.
      description: |
        Requires the facility, its site and the market's community to exist,
        the site to list the facility and the community to list that site.
        Uses the latest version of each facility, site and community; deleted
        ones count as unknown. An ID mapping alone does not establish eligibility. Does not check
        the market's opening/closing times or contract authorization.
        Facility and community identities match exactly, including case; each result echoes its
        requested identifiers exactly. Invalid facility identities return
        unknown_facility for that pair rather than failing the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/FacilityMarketValidationRequest"
      responses:
        "200":
          description: One result per pair, preserving input order, duplicates and IDs; an empty request returns an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacilityMarketValidationResult"
        "400":
          description: Invalid JSON or request shape.
        "500":
          description: Storage unavailable or corrupt records; no eligibility results are returned.
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [VALIDATION_UNAVAILABLE] }
                  message: { type: string }

components:
  parameters:
    MarketIdQuery:
      in: query
      name: market_id
      required: false
      description: Hyphenated UUIDv4 market ID in either letter case; no surrounding whitespace.
      schema: { type: string }
    StartTimeQuery:
      in: query
      name: start_time
      required: false
      schema: { type: string, description: "ISO 8601 timestamp." }
    EndTimeQuery:
      in: query
      name: end_time
      required: false
      schema: { type: string, description: "ISO 8601 timestamp." }

  responses:
    InternalError:
      description: Internal server error.

  schemas:
    FacilityMarketValidationRequest:
      type: object
      required: [facility_id, market_id]
      properties:
        facility_id:
          type: string
          description: Original off-chain facility ID, not its owner or on-chain mapping.
        market_id:
          type: string
          description: Hyphenated UUIDv4 market ID.

    FacilityMarketValidationResult:
      type: object
      required: [facility_id, market_id, eligible]
      properties:
        facility_id: { type: string }
        market_id: { type: string }
        eligible: { type: boolean }
        reason:
          type: string
          description: Present only for an ineligible pair; not an infrastructure error.
          enum: [unknown_market, unknown_facility, unknown_community, unknown_site, facility_not_listed_in_site, site_not_in_community]

    InsertedIds:
      description: |
        Map from input index to the inserted MongoDB ObjectId, serialized as
        {"$oid": "24 hex digits"}. Upserts of existing records may return their
        string identifier instead.
      type: object
      additionalProperties:
        oneOf:
          - type: object
            required: ["$oid"]
            properties:
              "$oid": { type: string, pattern: "^[a-fA-F0-9]{24}$" }
          - type: string
      example: { "0": { "$oid": "507f1f77bcf86cd799439011" } }

    OrderType:
      type: string
      enum: [bid, offer]

    OrderStatus:
      type: string
      enum: [submitted, partially_filled, filled, cancelled, expired, rejected, executed]
      default: submitted

    EnergyType:
      type: string
      enum: [GREEN, PV, HYDRO, BIOMASS, BATTERY, NONE]

    EwdsOrderDto:
      description: |
        EWDS-side order DTO. Field names are camelCase on the wire.
        Timestamps (`timeSlot`, `creationTime`, `updatedAt`) are Unix epoch
        integers rather than ISO 8601 strings.
      type: object
      required:
        - orderId
        - marketId
        - orderType
        - orderStatus
        - timeSlot
        - quantity
        - priceLimit
        - createdBy
        - creationTime
      properties:
        orderId: { type: string, description: "Hyphenated UUIDv4; stored and returned as lowercase UUID text." }
        marketId: { type: string, description: "Hyphenated UUIDv4; stored and returned as lowercase UUID text." }
        orderType: { $ref: "#/components/schemas/OrderType" }
        orderStatus: { $ref: "#/components/schemas/OrderStatus" }
        timeSlot: { type: string, format: date-time }
        quantity: { type: number, format: double }
        priceLimit: { type: number, format: double }
        energySourcePreference:
          $ref: "#/components/schemas/EnergyType"
          nullable: true
        energyType:
          $ref: "#/components/schemas/EnergyType"
          nullable: true
        createdBy: { type: string, description: "Original off-chain owner ID, not a facility ID, hash or wallet. Nonempty, unpadded strings are preserved exactly and remain case-sensitive in imports, queries and lifecycle notifications." }
        creationTime: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          nullable: true
        rejectReason:
          type: string
          nullable: true
        preferredTradingPartner:
          type: string
          nullable: true
          description: Optional registered off-chain preferred owner identity for bids and offers. Must be nonempty and unpadded; all actor IDs remain case-sensitive, including UUID-shaped strings.
        preferredEnergyRate:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Preferred bilateral energy rate in EUR/kWh.

    FlexibilityOrderType:
      type: string
      enum: [flexibility_offer, flexibility_bid]

    FlexibilityOrderSchema:
      type: object
      required:
        - order_id
        - order_type
        - flexibility_type
        - available_power
        - duration
        - activation_window_start
        - activation_window_end
        - price
        - currency
        - created_by
        - from_asset
      properties:
        order_id: { type: string }
        order_type: { $ref: "#/components/schemas/FlexibilityOrderType" }
        flexibility_type: { type: string }
        available_power: { type: number, format: double }
        duration:
          type: string
          description: "ISO 8601 duration (e.g. PT30M)."
        activation_window_start: { type: string }
        activation_window_end: { type: string }
        price: { type: number, format: double }
        currency: { type: string }
        created_by: { type: string }
        from_asset: { type: string }

    TariffSchema:
      type: object
      required:
        - tariff_name
        - tariff_structure
        - energy_price
        - grid_fee
        - taxes
        - incentives
        - currency
        - tariff_start
        - tariff_end
      properties:
        tariff_name: { type: string }
        tariff_structure: { type: string }
        energy_price: { type: number, format: double }
        grid_fee: { type: number, format: double }
        taxes: { type: number, format: double }
        incentives: { type: number, format: double }
        currency: { type: string }
        tariff_start: { type: string }
        tariff_end: { type: string }

    TradeStatus:
      type: string
      description: |
        matched: the match is included in a block indexed by the listener (no confirmation depth).
        settled: the trade has been processed in the Settlement market; transition not yet implemented.
        executed: delivery verification completed without penalties.
        penalized: a delivery penalty was recorded; this status is terminal.
      enum: [matched, executed, settled, penalized]

    MeasurementProfile:
      type: object
      required: [facility_id, community_uuid, time_slot, creation_time, energy_kwh]
      properties:
        facility_id: { type: string, description: Canonical off-chain facility identity. }
        community_uuid: { type: string, description: "Nonempty, unpadded opaque actor ID on typed-profile ingress; preserved exactly and case-sensitive. Direct measurement points may carry arbitrary datasource labels or no metadata." }
        time_slot: { type: integer, format: uint64, description: Unix seconds. }
        creation_time: { type: integer, format: uint64, description: Unix seconds. }
        energy_kwh: { type: number, format: double }

    ForecastProfile:
      allOf:
        - { $ref: "#/components/schemas/MeasurementProfile" }
        - type: object
          required: [confidence]
          properties:
            confidence: { type: number, format: double }

    EwdsTradeDto:
      description: |
        EWDS-side trade DTO. Field names are camelCase on the wire.
        `timestamp` is the RFC 3339 creation time, unchanged by lifecycle updates.
        Trade notifications carry the status-change time in the envelope's `occurredAt`.
        Entity IDs accept hyphenated UUIDv4 in either letter case on import; reads and events
        use lowercase UUID text. buyerId/sellerId are original off-chain owner IDs,
        preserved exactly and case-sensitive, not on-chain hashes or wallets. Optional residual IDs use null for absence; other values follow the same UUIDv4 rule.
      type: object
      required:
        - tradeId
        - marketId
        - bidId
        - buyerId
        - offerId
        - sellerId
        - tradeStatus
        - tradeQuantity
        - tradePrice
        - timestamp
      properties:
        tradeId: { type: string }
        marketId: { type: string }
        bidId: { type: string }
        buyerId: { type: string }
        residualBidId:
          type: string
          nullable: true
        offerId: { type: string }
        sellerId: { type: string }
        residualOfferId:
          type: string
          nullable: true
        tradeStatus: { $ref: "#/components/schemas/TradeStatus" }
        tradeQuantity: { type: number, format: double }
        tradePrice: { type: number, format: double }
        timestamp: { type: string, format: date-time }

    ClearingStatus:
      type: string
      enum: [final, partial, rejected, no_bid]

    NoBidReason:
      type: string
      enum:
        - invalid_inputs
        - stale_input
        - hard_constraints
        - policy_unavailable
        - deadline_missed
        - timeout
        - operator_disabled
        - market_reject

    EwdsClearingResultDto:
      description: |
        EWDS-side clearing-result DTO. Field names are camelCase on the wire.
        `createdAt` is a Unix epoch integer.
      type: object
      required:
        - marketId
        - clearingStatus
        - clearingPrice
        - totalSupply
        - totalDemand
        - tradeQuantity
        - numTrades
        - txHash
        - createdAt
      properties:
        marketId: { type: string }
        clearingStatus: { $ref: "#/components/schemas/ClearingStatus" }
        noBidReason:
          $ref: "#/components/schemas/NoBidReason"
          nullable: true
        clearingPrice: { type: number, format: double }
        totalSupply: { type: number, format: double }
        totalDemand: { type: number, format: double }
        tradeQuantity: { type: number, format: double }
        numTrades: { type: integer, format: int32, minimum: 0 }
        txHash: { type: string }
        createdAt: { type: integer, format: int64, minimum: 0 }

    MarketRoleSchema:
      type: object
      required: [role_name, role_description, assigned_to]
      properties:
        role_name: { type: string }
        role_description: { type: string }
        assigned_to:
          type: array
          items: { type: string }

    MarketType:
      type: string
      enum: [Spot, Flexibility, Settlement]

    MarketSchema:
      type: object
      required:
        - market_id
        - community_id
        - opening_time
        - closing_time
        - delivery_start_time
        - delivery_end_time
        - market_type
      properties:
        market_id:
          type: string
          description: Hyphenated UUIDv4 in either letter case on input; lowercase UUID text on output.
        community_id:
          type: string
          description: Nonempty, unpadded opaque off-chain community ID, preserved exactly. Chain events resolve the keyed community hash through a registered ID mapping; a missing mapping fails ingestion for retry instead of storing the hash as a UUID.
        opening_time: { type: string }
        closing_time: { type: string }
        delivery_start_time: { type: string }
        delivery_end_time: { type: string }
        market_type: { $ref: "#/components/schemas/MarketType" }

    MeasurementPointType:
      type: string
      enum: [Measurement, Forecast]

    FlowDirection:
      type: string
      enum: [Import, Export]

    MeasurementPointSchema:
      type: object
      required:
        - type
        - measurement_id
        - property_measured
        - unit
        - direction
        - energy_accumulated
        - time_resolution
        - phase
        - asset_name
      properties:
        type: { $ref: "#/components/schemas/MeasurementPointType" }
        measurement_id: { type: string }
        property_measured: { type: string }
        unit: { type: string }
        direction: { $ref: "#/components/schemas/FlowDirection" }
        energy_accumulated: { type: boolean }
        time_resolution: { type: string }
        phase: { type: integer, format: int32, minimum: 0, maximum: 255 }
        asset_name: { type: string }
        datasource_name:
          type: string
          nullable: true
          description: Generic datasource label, preserved exactly without actor-ID validation, including empty, padded or UUID-shaped strings. Absent metadata remains readable without a community filter.

    TimeseriesSchema:
      type: object
      required: [measurement_point, timestamp, value]
      properties:
        measurement_point: { type: string }
        timestamp: { type: string }
        value: { type: number, format: double }

    AssetType:
      type: string
      enum:
        - EnergyAsset
        - Battery
        - PV
        - Heatpump
        - DistrictHeating
        - EVCharger
        - EnergyInfrastructure

    AssetSchema:
      type: object
      required: [asset_type, uuid, asset_name, facility_name, creation_time]
      properties:
        asset_type: { $ref: "#/components/schemas/AssetType" }
        uuid: { type: string }
        asset_name: { type: string }
        facility_name: { type: string }
        creation_time: { type: integer, format: int64, minimum: 0 }
        installed_power:
          type: number
          format: double
          nullable: true
        asset_subtype:
          type: string
          nullable: true
        technology_type:
          type: string
          nullable: true
        phase_connection:
          type: string
          nullable: true
        energy_capacity:
          type: number
          format: double
          nullable: true
        maximum_soc:
          type: number
          format: double
          nullable: true
        minimum_soc:
          type: number
          format: double
          nullable: true
        roundtrip_efficiency:
          type: number
          format: double
          nullable: true
        target_service:
          type: string
          nullable: true
        grid_connection_type:
          type: string
          nullable: true
        max_rated_current:
          type: number
          format: double
          nullable: true
        has_smart_meter:
          type: boolean
          nullable: true
        tariff_name:
          type: string
          nullable: true

    PilotSiteSchema:
      type: object
      required:
        - pilot_name
        - pilot_description
        - start_date
        - end_date
        - latitude
        - longitude
        - communities
      properties:
        pilot_name: { type: string }
        pilot_description: { type: string }
        start_date: { type: string }
        end_date: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        communities:
          type: array
          items: { type: string }

    EwdsCommunityDto:
      type: object
      required: [communityId, communityName, sites]
      properties:
        communityId:
          type: string
          description: Exact nonempty, unpadded, case-sensitive off-chain community ID, including UUID-shaped strings.
        communityName: { type: string }
        sites:
          type: array
          items: { type: string }
        validFrom: { $ref: "#/components/schemas/ValidFrom" }
        validUntil: { $ref: "#/components/schemas/ValidUntil" }

    EwdsSiteDto:
      type: object
      description: Site IDs and facility references are exact nonempty, unpadded actor identities. Identical facility references are deduplicated. Names are not identifiers.
      required: [site_id, site_name, site_description, facilities]
      properties:
        site_id: { type: string }
        site_name: { type: string }
        site_description: { type: string }
        facilities:
          type: array
          items: { type: string }
        valid_from: { $ref: "#/components/schemas/ValidFrom" }
        valid_until: { $ref: "#/components/schemas/ValidUntil" }

    EwdsFacilityDto:
      type: object
      description: Nonempty, unpadded facility and owner IDs are preserved exactly and remain case-sensitive, including UUID-shaped, bare or 0x hex strings. Site IDs follow the same actor-ID rule; names are unchanged.
      required:
        - facility_id
        - facility_name
        - site_id
        - owner_id
      properties:
        facility_id: { type: string }
        facility_name: { type: string }
        site_id:
          type: string
          description: The `site_id` of the facility's site.
        owner_id: { type: string }
        valid_from: { $ref: "#/components/schemas/ValidFrom" }
        valid_until: { $ref: "#/components/schemas/ValidUntil" }

    ValidFrom:
      type: string
      format: date-time
      description: |
        When the off-chain storage received this version, in UTC with whole seconds,
        e.g. `2026-12-01T00:00:00+00:00`. Set by the server; a value sent is ignored.

    ValidUntil:
      type: string
      format: date-time
      description: |
        From when the entry counts as deleted. Any RFC 3339 offset is accepted, and the
        time is stored and returned in UTC with whole seconds. Leave it out to keep the
        entry valid.

    LocalOriginRecord:
      description: |
        `local_origin_record` record type. Mirrors `primitives::certificates::LocalOriginRecord`.
        Optional fields are always present and `null` when unset.
      type: object
      required:
        - identity
        - time_and_quantity
        - production_asset
        - consumption_asset
        - location
        - measurement_provenance
        - attribute_provenance
        - beneficiary_and_claim
        - trade_and_delivery
      properties:
        identity:
          type: object
          properties:
            record_type: { type: string, enum: [local_origin_record] }
            site_id:
              type: string
              description: |
                The seller facility's `site_id` from the database — the site through which
                `location.community_id_origin` is resolved (listed in that community's `sites`).
                Not configurable.
        time_and_quantity:
          type: object
          properties:
            interval_start: { type: string, format: date-time }
            interval_end: { type: string, format: date-time }
            interval_duration_s: { type: integer, format: int64 }
            source_slot_timestamp: { type: integer, format: int64 }
            energy_quantity: { type: number, format: double }
            energy_unit: { type: string, enum: [kWh] }
            rounding_rule: { type: string }
            loss_adjustment: { type: [number, "null"], format: double }
        production_asset:
          type: object
          properties:
            production_asset_id: { type: string, description: Seller facility id. }
            asset_registry_reference: { type: [string, "null"] }
            metering_point_id: { type: [string, "null"], description: Seller facility id. }
            asset_class: { $ref: "#/components/schemas/GooAssetClass" }
            rated_power:
              description: Always null.
              type: ["null", object]
              properties:
                value: { type: number, format: double }
                unit: { type: string }
        consumption_asset:
          type: object
          properties:
            consumption_asset_id:
              type: string
              description: Buyer facility id, else buyer community id, else the original off-chain buyer ID.
            asset_registry_reference: { type: [string, "null"] }
            metering_point_id: { type: [string, "null"] }
            asset_class: { $ref: "#/components/schemas/GooAssetClass" }
        location:
          type: object
          properties:
            municipality_code: { type: string }
            grid_operator_id: { type: string }
            grid_level: { type: integer, format: int32 }
            community_id_origin: { type: [string, "null"] }
            community_id_consumption: { type: [string, "null"] }
            delivery_scope:
              type: string
              enum: [intra_community, inter_community, supplier_offtake]
        measurement_provenance:
          type: object
          properties:
            measurement_id: { type: string }
            measuring_sensor_id: { type: string }
            property_measured: { type: string }
            flow_direction: { type: string, enum: [import, export] }
            data_provider_id: { type: string }
            data_completeness: { type: string, enum: [complete, substituted, incomplete] }
            source_of_record: { type: string, enum: [platform, operator_validated] }
            data_record_class: { type: string, enum: [measurement, forecast] }
            measurement_recorded_at: { type: integer, format: int64 }
        attribute_provenance:
          type: object
          properties:
            support_scheme_status:
              type: [string, "null"]
              enum: [feed_in_tariff, one_off_payment, waiting_list, none, null]
            storage_mediated_flag: { type: boolean }
        beneficiary_and_claim:
          type: object
          properties:
            owner_id: { type: string, description: Original off-chain seller owner ID. }
            consumption_metering_point_id:
              type: [string, "null"]
              description: Buyer facility id; null when the buyer is not a facility.
            facility_id: { type: [string, "null"] }
        trade_and_delivery:
          type: object
          properties:
            trade_reference: { type: array, items: { type: string } }
            trade_hash: { type: array, items: { type: string } }
            trade_status_at_issuance:
              type: [string, "null"]
              enum: [settled, delivery_verified, null]
            delivery_verification_reference: { type: [string, "null"] }

    GooAssetClass:
      type: string
      enum: [PV, Battery, HeatPump, MeteringPoint]
