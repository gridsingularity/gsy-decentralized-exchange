[workspace]
resolver = "3"

members = [
    "primitives",
    "gsy-community-client",
    "gsy-execution-engine",
    "gsy-market-orchestrator",
    "gsy-matching-engine",
    "gsy-offchain-storage",
    "gsy-ethers-listener",
    "e2e-tests",
]

exclude = [
    "gsy-contracts",
]

[workspace.dependencies]
primitives = { path = "primitives" }
gsy-community-client = { path = "gsy-community-client" }
gsy-ethers-listener = { path = "gsy-ethers-listener" }

anyhow = "1"
async-trait = "0.1.89"
chrono = { version = "0.4.37", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ethers = "2.0.14"
ethers-solc = "2.0.14"
hex = "0.4.3"
mongodb = "3.3.0"
once_cell = "1.21.3"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.12.1", features = ["v4"] }
wiremock = "0.6.5"
