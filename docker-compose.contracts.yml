x-contracts-env: &contracts-env
  CONTRACTS_ENV_PATH: ${CONTRACTS_ENV_PATH:-/contracts/addresses.env}
  GAS_REPORT_PATH: ${GAS_REPORT_PATH:-/contracts/gas-report.md}
  GAS_REPORT_JSON_PATH: ${GAS_REPORT_JSON_PATH:-/contracts/gas-report.json}
  ORCHESTRATOR_SIGNER_PRIVATE_KEY: ${ORCHESTRATOR_SIGNER_PRIVATE_KEY:-}
  MATCHING_ENGINE_PRIVATE_KEY: ${MATCHING_ENGINE_PRIVATE_KEY:-}
  EXECUTION_ENGINE_PRIVATE_KEY: ${EXECUTION_ENGINE_PRIVATE_KEY:-}
  ACTOR_REGISTRAR_PRIVATE_KEY: ${ACTOR_REGISTRAR_PRIVATE_KEY:-}
  PROXY_ADMIN_PRIVATE_KEY: ${PROXY_ADMIN_PRIVATE_KEY:-}
  DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:-}
  EWC_RPC_URL: ${EWC_RPC_URL:-https://rpc.energyweb.org}
  VOLTA_RPC_URL: ${VOLTA_RPC_URL:-https://volta-rpc.energyweb.org}
  ALLOW_EWC_MAINNET_DEPLOY: ${ALLOW_EWC_MAINNET_DEPLOY:-false}
  GAS_REPORT_ALLOW_REMOTE: ${GAS_REPORT_ALLOW_REMOTE:-false}

services:
  anvil:
    profiles:
      - local-contracts
    container_name: anvil
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "${ANVIL_CHAIN_ID:-31337}"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "sh", "-c", "cast block-number --rpc-url http://localhost:8545 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  gsy-contracts-deploy-local:
    profiles:
      - local-contracts
    container_name: gsy-contracts-deploy-local
    build:
      context: ./gsy-contracts
      dockerfile: Dockerfile
    depends_on:
      anvil:
        condition: service_healthy
    command: npx hardhat run scripts/deploy.ts --network anvil
    environment:
      <<: *contracts-env
      ANVIL_RPC_URL: http://anvil:8545
      ANVIL_CHAIN_ID: ${ANVIL_CHAIN_ID:-31337}
      ORCHESTRATOR_SIGNER_PRIVATE_KEY: ${ORCHESTRATOR_SIGNER_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      MATCHING_ENGINE_PRIVATE_KEY: ${MATCHING_ENGINE_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      EXECUTION_ENGINE_PRIVATE_KEY: ${EXECUTION_ENGINE_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      ACTOR_REGISTRAR_PRIVATE_KEY: ${ACTOR_REGISTRAR_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      PROXY_ADMIN_PRIVATE_KEY: ${PROXY_ADMIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    volumes:
      - ./gsy-contracts:/app
      - /app/node_modules
      - ./contracts-output:/contracts

  gsy-contracts-gas-report-local:
    profiles:
      - local-contracts
    container_name: gsy-contracts-gas-report-local
    build:
      context: ./gsy-contracts
      dockerfile: Dockerfile
    depends_on:
      anvil:
        condition: service_healthy
    command: npx hardhat run scripts/gas-report.ts --network anvil
    environment:
      <<: *contracts-env
      ANVIL_RPC_URL: http://anvil:8545
      ANVIL_CHAIN_ID: ${ANVIL_CHAIN_ID:-31337}
    volumes:
      - ./gsy-contracts:/app
      - /app/node_modules
      - ./contracts-output:/contracts

  gsy-contracts-deploy-remote:
    profiles:
      - remote-contracts
    container_name: gsy-contracts-deploy-remote
    build:
      context: ./gsy-contracts
      dockerfile: Dockerfile
    command: npx hardhat run scripts/deploy.ts --network ${CONTRACTS_HARDHAT_NETWORK:-volta}
    environment:
      <<: *contracts-env
    volumes:
      - ./gsy-contracts:/app
      - /app/node_modules
      - ./contracts-output:/contracts

  gsy-contracts-gas-report-remote:
    profiles:
      - remote-contracts
    container_name: gsy-contracts-gas-report-remote
    build:
      context: ./gsy-contracts
      dockerfile: Dockerfile
    command: npx hardhat run scripts/gas-report.ts --network ${CONTRACTS_HARDHAT_NETWORK:-volta}
    environment:
      <<: *contracts-env
    volumes:
      - ./gsy-contracts:/app
      - /app/node_modules
      - ./contracts-output:/contracts
