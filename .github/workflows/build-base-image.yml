name: Build and Publish Base Image

on:
  push:
    branches: [GSYDEXv2]
    paths:
      - Dockerfile.base
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
      - .github/workflows/build-base-image.yml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ghcr.io/gridsingularity/gsy-rust-base:latest
            ghcr.io/gridsingularity/gsy-rust-base:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/gridsingularity/gsy-rust-base:buildcache
          cache-to: type=registry,ref=ghcr.io/gridsingularity/gsy-rust-base:buildcache,mode=max
