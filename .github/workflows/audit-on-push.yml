name: Security audit

permissions:
  contents: read

on:
  pull_request:

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust lockfiles
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' lockfiles < <(find . -name Cargo.lock -not -path './target/*' -print0 | sort -z)

          if [ "${#lockfiles[@]}" -eq 0 ]; then
            echo "No Cargo.lock files found."
            exit 0
          fi

          # Accepted transitive advisories that are currently pinned by upstream stacks
          # such as ethers 2.x. Keep bytes unignored because it can
          # be fixed with a lockfile refresh to >= 1.11.1.
          ignored_advisories=(
            RUSTSEC-2024-0344 # curve25519-dalek via Substrate / schnorrkel
            RUSTSEC-2025-0009 # ring 0.16 via ethers-providers -> jsonwebtoken 8
            RUSTSEC-2026-0012 # rustls-webpki 0.101 via ethers-providers -> reqwest 0.11
            RUSTSEC-2026-0049 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0098 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0099 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0104 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0258 # h2 0.3 via ethers 2.x / reqwest 0.11; no patched 0.3 release
            # zip 0.6 via ethers-solc 2.x -> svm-rs 0.3. svm-rs is optional (svm-solc feature),
            # which no crate enables, so zip is only listed in Cargo.lock and never compiled.
            # svm-rs 0.3.5 is the last release ethers-solc 2.x accepts and it pins zip 0.6.
            RUSTSEC-2026-0367 # zip extraction preserves SUID/SGID bits
            RUSTSEC-2026-0368 # zip extraction follows symlinks outside the destination
            RUSTSEC-2026-0369 # zip extraction applies permissions through symlinks
            # The same inactive zip dependency locks zstd-safe 5.x; keep active versions >=8.2.0.
            RUSTSEC-2026-0403 # legacy streaming decompression can expose uninitialized memory
            # Temporary accepted risk: ethers 2.x -> k256 0.13 -> elliptic-curve 0.13 pins
            # crypto-bigint 0.5. This is ACTIVE in transaction signing, not an unused dependency.
            # TODO: upgrade/replace the signing stack to use crypto-bigint >=0.7.6 and remove
            # this exception. Until then, secret-dependent timing remains a known risk.
            RUSTSEC-2026-0387
            # Temporary rustls 0.21 exceptions via ethers / reqwest; no patched 0.21 release.
            # Keep rustls 0.23 patched to >=0.23.46 in Cargo.lock despite these ID-wide ignores.
            # Revisit when migrating the legacy TLS stack or adding custom TLS configuration.
            RUSTSEC-2026-0346 # No custom ClientSessionStore Debug logging; built-in caches redact secrets
            RUSTSEC-2026-0349 # rustls 0.21 supports only classical key exchange, not hybrid post-quantum groups
            # Temporary zip 0.6 exceptions: locked via optional ethers-solc -> svm-rs 0.3.
            # svm-solc is disabled; its ZIP extraction is Windows-only. No compatible patch.
            # The guard below rejects any active ZIP dependency, including tests/all targets.
            # Remove these exceptions when the legacy compiler dependency is replaced.
            RUSTSEC-2026-0367 # Extraction preserves SUID/SGID permissions
            RUSTSEC-2026-0368 # Extraction permits symlinks outside the destination
            RUSTSEC-2026-0369 # Extraction applies permissions through symlinks
            # Distrusted emSign intermediates, via the same ethers / reqwest 0.11 TLS stack;
            # no patched rustls-webpki 0.101 or webpki-roots 0.25 release.
            # Keep rustls-webpki 0.103 >=0.103.16 and webpki-roots 1.x >=1.0.10 (via mongodb)
            # patched in Cargo.lock despite these ID-wide ignores.
            RUSTSEC-2026-0381 # webpki-roots 0.25 via reqwest 0.11 bundles the distrusted roots
            RUSTSEC-2026-0382 # rustls-webpki 0.101 via rustls 0.21 may accept distrusted intermediates
            RUSTSEC-2026-0097 # rand warning; no direct rand::rng custom logger usage
            RUSTSEC-2024-0442 # wasmtime-jit-debug via Substrate / wasmtime runtime
            RUSTSEC-2025-0055 # tracing-subscriber via transitive logging stacks
            RUSTSEC-2023-0091 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2024-0438 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2025-0118 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0020 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0021 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0085 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0086 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0087 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0088 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0089 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0091 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0092 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0093 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0094 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0095 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0096 # wasmtime via Substrate / sp-io dependency graph
          )

          audit_args=()
          for advisory in "${ignored_advisories[@]}"; do
            audit_args+=(--ignore "$advisory")
          done

          for lockfile in "${lockfiles[@]}"; do
            crate_dir="$(dirname "$lockfile")"
            echo "::group::cargo audit ${crate_dir}"
            (
              cd "$crate_dir"
              dependency_tree="$(cargo tree --locked --workspace --all-features --target all --edges normal,build,dev --prefix none)"
              if grep -q '^zip v' <<< "$dependency_tree"; then
                echo "ZIP is active in the dependency tree; revisit the temporary audit exceptions."
                exit 1
              fi
              if grep -Eq '^zstd-safe v([0-7]\.|8\.[01]\.)' <<< "$dependency_tree"; then
                echo "Vulnerable zstd-safe is active; upgrade to >=8.2.0 before using the audit exception."
                exit 1
              fi
              cargo audit "${audit_args[@]}"
            )
            echo "::endgroup::"
          done
