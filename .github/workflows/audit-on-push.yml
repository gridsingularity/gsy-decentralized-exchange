name: Security audit

permissions:
  contents: read

# No `paths:` filter on purpose: a path-filtered workflow reports no status at all
# when it does not run, which leaves required checks pending. Instead the job always
# runs and skips the audit steps (reporting success) when no Cargo files changed.
on:
  push:

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for Cargo manifest / lockfile changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # New branches have an all-zero "before" SHA; compare against main instead.
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          fi

          if [ -z "$base" ]; then
            echo "No base commit to compare against, auditing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" HEAD -- \
            '.github/workflows/audit-on-push.yml' \
            ':(glob)**/Cargo.toml' \
            ':(glob)**/Cargo.lock')"

          if [ -n "$changed_files" ]; then
            echo "Cargo files changed since ${base}:"
            echo "$changed_files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Security audit skipped::No Cargo.toml or Cargo.lock changes since ${base}."
            echo "### Security audit skipped :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`Cargo.toml\` or \`Cargo.lock\` changes since \`${base}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-audit
        if: steps.changes.outputs.changed == 'true'
        run: cargo install cargo-audit --locked

      - name: Audit Rust lockfiles
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' lockfiles < <(find . -name Cargo.lock -not -path './target/*' -print0 | sort -z)

          if [ "${#lockfiles[@]}" -eq 0 ]; then
            echo "No Cargo.lock files found."
            exit 0
          fi

          # Accepted transitive advisories that are currently pinned by upstream stacks
          # such as ethers 2.x. Keep bytes unignored because it can
          # be fixed with a lockfile refresh to >= 1.11.1.
          ignored_advisories=(
            RUSTSEC-2024-0344 # curve25519-dalek via Substrate / schnorrkel
            RUSTSEC-2025-0009 # ring 0.16 via ethers-providers -> jsonwebtoken 8
            RUSTSEC-2026-0012 # rustls-webpki 0.101 via ethers-providers -> reqwest 0.11
            RUSTSEC-2026-0049 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0098 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0099 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0104 # rustls-webpki via rustls stacks pulled by ethers / reqwest
            RUSTSEC-2026-0258 # h2 0.3 via ethers 2.x / reqwest 0.11; no patched 0.3 release
            RUSTSEC-2026-0097 # rand warning; no direct rand::rng custom logger usage
            RUSTSEC-2024-0442 # wasmtime-jit-debug via Substrate / wasmtime runtime
            RUSTSEC-2025-0055 # tracing-subscriber via transitive logging stacks
            RUSTSEC-2023-0091 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2024-0438 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2025-0118 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0020 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0021 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0085 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0086 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0087 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0088 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0089 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0091 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0092 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0093 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0094 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0095 # wasmtime via Substrate / sp-io dependency graph
            RUSTSEC-2026-0096 # wasmtime via Substrate / sp-io dependency graph
          )

          audit_args=()
          for advisory in "${ignored_advisories[@]}"; do
            audit_args+=(--ignore "$advisory")
          done

          for lockfile in "${lockfiles[@]}"; do
            crate_dir="$(dirname "$lockfile")"
            echo "::group::cargo audit ${crate_dir}"
            (cd "$crate_dir" && cargo audit "${audit_args[@]}")
            echo "::endgroup::"
          done
