name: Build and Deploy Staging

on:
  push:
    branches: [GSYDEXv2]

jobs:
  # CI and staging runners are amd64. Macs build their own base image locally
  # (see run_integration_tests.sh).
  base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gridsingularity/gsy-rust-base:latest
            ghcr.io/gridsingularity/gsy-rust-base:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/gridsingularity/gsy-rust-base:buildcache
          cache-to: type=registry,ref=ghcr.io/gridsingularity/gsy-rust-base:buildcache,mode=max

  build-and-push:
    needs: base-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push all services
        run: |
          docker compose -f docker-compose.staging.yml build
          docker compose -f docker-compose.staging.yml push

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          script: |
            cd /root/gsy-decentralized-exchange
            git pull --ff-only origin ${{ github.ref_name }}  # update the repo in the server before pulling the images 
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml --env-file .env.ewds.local up -d
            docker image prune -f
