name: Security audit

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust lockfiles
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' lockfiles < <(find . -name Cargo.lock -not -path './target/*' -print0 | sort -z)

          if [ "${#lockfiles[@]}" -eq 0 ]; then
            echo "No Cargo.lock files found."
            exit 0
          fi

          for lockfile in "${lockfiles[@]}"; do
            crate_dir="$(dirname "$lockfile")"
            echo "::group::cargo audit ${crate_dir}"
            (cd "$crate_dir" && cargo audit)
            echo "::endgroup::"
          done
