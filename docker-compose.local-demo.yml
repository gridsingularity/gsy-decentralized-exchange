

x-mongo-node: &mongo-node
  image: mongo:8.0
  command: ["mongod", "--replSet", "rs0", "--keyFile", "/keyfile/mongo-keyfile", "--bind_ip_all"]
  restart: unless-stopped
  depends_on:
    mongo-keyfile-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  gsy-node:
    container_name: gsy-node
    build:
      context: .
      dockerfile: ./gsy-node/Dockerfile
    env_file:
      - ./.env/gsy-node.env
    ports:
      - "9944:9944"
      - "9933:9933"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -H ''Content-Type: application/json'' -d ''{"id":1, "jsonrpc":"2.0", "method":"system_health"}'' http://localhost:9944 | grep -q ''"result":''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gsy-offchain-storage:
    container_name: gsy-offchain-storage
    build:
      context: .
      dockerfile: ./gsy-offchain-storage/Dockerfile
    env_file:
      - ./.env/gsy-offchain-storage.env
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    networks:
      default:
        # The community client / matching / execution engines address off-chain
        # storage as `gsy-orderbook`; expose that alias here.
        aliases:
          - gsy-orderbook
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gsy-matching-engine:
    container_name: gsy-matching-engine
    build:
      context: .
      dockerfile: ./gsy-matching-engine/Dockerfile
    env_file:
      - ./.env/gsy-matching-engine.env
    depends_on:
      gsy-offchain-storage:
        condition: service_healthy
      gsy-node:
        condition: service_healthy
    working_dir: /var/www/matching-engine
    entrypoint: ["/usr/local/bin/gsy-matching-engine", "web3", "http://gsy-offchain-storage", "8080", "ws://gsy-node", "9944"]

  # Sudo-registers the trading user (//Alice) and the exchange operator
  # so the orchestrator will create markets and the community client's orders are
  # accepted.
  gsy-bootstrap:
    container_name: gsy-bootstrap
    build:
      context: ./deployment/bootstrap
      dockerfile: Dockerfile
    env_file:
      - ./.env/gsy-bootstrap.env
    depends_on:
      gsy-node:
        condition: service_healthy
    restart: "no"

  gsy-market-orchestrator:
    container_name: gsy-market-orchestrator
    build:
      context: .
      dockerfile: ./gsy-market-orchestrator/Dockerfile
    env_file:
      - ./.env/gsy-market-orchestrator.env
    depends_on:
      gsy-node:
        condition: service_healthy
      gsy-offchain-storage:
        condition: service_healthy
      gsy-bootstrap:
        condition: service_completed_successfully

  gsy-execution-engine:
    container_name: gsy-execution-engine
    build:
      context: .
      dockerfile: ./gsy-execution-engine/Dockerfile
    env_file:
      - ./.env/gsy-execution-engine.env
    depends_on:
      gsy-offchain-storage:
        condition: service_healthy
      gsy-node:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/gsy-execution-engine", "web3", "http://gsy-offchain-storage", "8080", "ws://gsy-node", "9944", "30", "3600", "0.10"]

  # EWF DID / verifiable-credential service. Mints one did:ethr per ontology asset
  # and per community from ASSET_DID_MASTER_SEED; gsy-community-client pushes the
  # subject set to it on POST /asset-dids/sync.
  #
  # NOTE the build context differs from every other service here: this image's
  # Dockerfile does `COPY package.json ./`, so it must be built from its own
  # directory, not from the repo root.
  gsy-ewf-identity-server:
    container_name: gsy-ewf-identity-server
    build:
      context: ./gsy-ewf-identity-server
      dockerfile: Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    # Secrets: ASSET_DID_MASTER_SEED, ISSUER_PRIVATE_KEY/ISSUER_PUBLIC_KEY, JWT_SECRET.
    # EWC_RPC_URL must be reachable at boot — did.service.ts:32-60 calls getNetwork()
    # and identityOwner() in onModuleInit, so the service will not start without it.
    env_file:
      - ./.env/gsy-ewf-identity-server.env
    # Inline wins over env_file. Uses the existing rs0 replica set with its own
    # database (identitydb) — no separate mongo container.
    environment:
      - MONGODB_URI=mongodb://gsy:gsy@mongo1:27017,mongo2:27017,mongo3:27017/identitydb?authSource=admin&replicaSet=rs0
      - API_KEY=fedecom_user
    # node:18-alpine has no curl (unlike the Rust images above), so this uses
    # busybox wget. /api-json is the Swagger document: unauthenticated, and served
    # only once Nest has finished booting.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api-json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gsy-community-client:
    container_name: gsy-community-client
    build:
      context: .
      dockerfile: ./gsy-community-client/Dockerfile
    env_file:
      - ./.env/gsy-community-client.env
    # Plain bridge networking here (no Tailscale namespace), so services address each
    # other by name. This is also the Rust-side default (constants.rs), set explicitly
    # so the file documents itself. Deliberately not a depends_on: an unavailable
    # identity server must not delay or stall forecast ingestion or order publication.
    environment:
      - IDENTITY_SERVER_URL=http://gsy-ewf-identity-server:3000
    depends_on:
      gsy-node:
        condition: service_healthy
      gsy-offchain-storage:
        condition: service_healthy
      gsy-bootstrap:
        condition: service_completed_successfully

  # --- MongoDB replica set (rs0), test topology ---
  mongo-keyfile-init:
    image: mongo:8.0
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /keyfile/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 > /keyfile/mongo-keyfile
        fi
        chmod 400 /keyfile/mongo-keyfile
        chown 999:999 /keyfile/mongo-keyfile
    volumes:
      - mongo-keyfile:/keyfile
    restart: "no"

  mongo1:
    <<: *mongo-node
    container_name: mongo1
    env_file:
      - ./.env/mongo.env
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
      - mongo-keyfile:/keyfile:ro

  mongo2:
    <<: *mongo-node
    container_name: mongo2
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
      - mongo-keyfile:/keyfile:ro

  mongo3:
    <<: *mongo-node
    container_name: mongo3
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
      - mongo-keyfile:/keyfile:ro

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    entrypoint: ["bash", "/mongo-rs-init.sh"]
    volumes:
      - ./deployment/mongodb-dev/mongo-rs-init.sh:/mongo-rs-init.sh:ro
    restart: "no"

volumes:
  mongo-keyfile:
  mongo1-data:
  mongo2-data:
  mongo3-data:
