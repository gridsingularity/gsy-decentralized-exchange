x-gsy-ewds-env: &gsy-ewds-env
  EWDS_GATEWAY_URL: ${EWDS_GATEWAY_URL:-http://ddhub-gateway-api:3333}
  EWDS_REQUEST_PUBLISH_FQCN: ${EWDS_REQUEST_PUBLISH_FQCN:-gsy.intelligent.requests.pub}
  EWDS_REQUEST_SUBSCRIBE_FQCN: ${EWDS_REQUEST_SUBSCRIBE_FQCN:-gsy.intelligent.requests.sub}
  EWDS_RESPONSE_PUBLISH_FQCN: ${EWDS_RESPONSE_PUBLISH_FQCN:-gsy.intelligent.responses.pub}
  EWDS_RESPONSE_SUBSCRIBE_FQCN: ${EWDS_RESPONSE_SUBSCRIBE_FQCN:-gsy.intelligent.responses.sub}
  EWDS_TOPIC_OWNER: ${EWDS_TOPIC_OWNER:-integration.apps.intelligent.auth.ewc}
  EWDS_TOPIC_VERSION: ${EWDS_TOPIC_VERSION:-1.0.0}
  EWDS_ORDERS_REQUEST_TOPIC: ${EWDS_ORDERS_REQUEST_TOPIC:-ordersQuery}
  EWDS_ORDERS_RESPONSE_TOPIC: ${EWDS_ORDERS_RESPONSE_TOPIC:-ordersQueryResponse}
  EWDS_TRADES_REQUEST_TOPIC: ${EWDS_TRADES_REQUEST_TOPIC:-tradesQuery}
  EWDS_TRADES_RESPONSE_TOPIC: ${EWDS_TRADES_RESPONSE_TOPIC:-tradesQueryResponse}
  EWDS_CLEARING_RESULTS_REQUEST_TOPIC: ${EWDS_CLEARING_RESULTS_REQUEST_TOPIC:-clearingResultsQuery}
  EWDS_CLEARING_RESULTS_RESPONSE_TOPIC: ${EWDS_CLEARING_RESULTS_RESPONSE_TOPIC:-clearingResultsQueryResponse}
  EWDS_MARKETS_REQUEST_TOPIC: ${EWDS_MARKETS_REQUEST_TOPIC:-marketsQuery}
  EWDS_MARKETS_RESPONSE_TOPIC: ${EWDS_MARKETS_RESPONSE_TOPIC:-marketsQueryResponse}
  EWDS_FACILITIES_REQUEST_TOPIC: ${EWDS_FACILITIES_REQUEST_TOPIC:-facilitiesQuery}
  EWDS_FACILITIES_RESPONSE_TOPIC: ${EWDS_FACILITIES_RESPONSE_TOPIC:-facilitiesQueryResponse}
  EWDS_MEASUREMENTS_REQUEST_TOPIC: ${EWDS_MEASUREMENTS_REQUEST_TOPIC:-measurementsQuery}
  EWDS_MEASUREMENTS_RESPONSE_TOPIC: ${EWDS_MEASUREMENTS_RESPONSE_TOPIC:-measurementsQueryResponse}
  EWDS_RESPONSE_TIMEOUT_MS: ${EWDS_RESPONSE_TIMEOUT_MS:-60000}
  EWDS_RESPONSE_POLL_INTERVAL_MS: ${EWDS_RESPONSE_POLL_INTERVAL_MS:-1000}

services:

  gsy-offchain-storage:
    container_name: gsy-offchain-storage
    build:
      context: .
      dockerfile: ./gsy-offchain-storage/Dockerfile
    depends_on:
      mongodb:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      <<: *gsy-ewds-env
      APPLICATION_HOST: "0.0.0.0"
      APPLICATION_PORT: "8080"
      DATABASE_NAME: offchain_storage
      DATABASE_HOST: mongodb
      DATABASE_URL_SCHEME: mongodb
      DATABASE_USERNAME: gsy
      DATABASE_PASSWORD: gsy
      SCHEDULER_INTERVAL: "900"
      EVM_NODE_URL: ${EVM_NODE_URL:-ws://anvil:8545}
      CONTRACT_ORDER_REGISTRY: ${ORDER_REGISTRY_ADDRESS:-0x5FC8d32690cc91D4c39d9d3abcBD16989F875707}
      CONTRACT_TRADE_SETTLEMENT: ${TRADE_SETTLEMENT_ADDRESS:-0xa513E6E4b8f2a923D98304ec87F64353C4D5C853}
      CONTRACT_MARKET_CONTROLLER: ${MARKET_CONTROLLER_ADDRESS:-0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9}
      EWDS_ENABLE_HANDLER: "${EWDS_ENABLE_HANDLER:-false}"
      EWDS_REQUEST_CLIENT_ID: ${EWDS_OFFCHAIN_STORAGE_CLIENT_ID:-gsyoffchainstorage}
      EWDS_HANDLER_POLL_INTERVAL_MS: ${EWDS_HANDLER_POLL_INTERVAL_MS:-500}
      EWDS_HANDLER_BATCH_SIZE: ${EWDS_HANDLER_BATCH_SIZE:-100}

  gsy-matching-engine:
    container_name: gsy-matching-engine
    build:
      context: .
      dockerfile: ./gsy-matching-engine/Dockerfile
    depends_on:
      gsy-offchain-storage:
        condition: service_started
    entrypoint: ["/usr/local/bin/gsy-matching-engine"]
    command: ["web3", "http://gsy-offchain-storage", "8080", "${EVM_NODE_HOST:-ws://anvil}", "${EVM_NODE_PORT:-8545}"]
    environment:
      <<: *gsy-ewds-env
      OFFCHAIN_STORAGE_TRANSPORT: ${OFFCHAIN_STORAGE_TRANSPORT:-http}
      OFFCHAIN_STORAGE_URL: "http://gsy-offchain-storage:8080"
      TRADE_SETTLEMENT_ADDRESS: ${TRADE_SETTLEMENT_ADDRESS:-0xa513E6E4b8f2a923D98304ec87F64353C4D5C853}
      MATCHING_ENGINE_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      EWDS_MATCHING_ENGINE_CLIENT_ID: ${EWDS_MATCHING_ENGINE_CLIENT_ID:-gsymatchingengine}

  gsy-community-client:
    container_name: gsy-community-client
    build:
      context: .
      dockerfile: ./gsy-community-client/Dockerfile
    depends_on:
      gsy-offchain-storage:
        condition: service_started
    environment:
      <<: *gsy-ewds-env
      OFFCHAIN_STORAGE_TRANSPORT: ${OFFCHAIN_STORAGE_TRANSPORT:-http}
      OFFCHAIN_STORAGE_URL: "http://gsy-offchain-storage:8080"
      EVM_NODE_URL: ${EVM_NODE_URL:-ws://anvil:8545}
      ORDER_REGISTRY_ADDRESS: ${ORDER_REGISTRY_ADDRESS:-0x5FC8d32690cc91D4c39d9d3abcBD16989F875707}
      COMMUNITY_CLIENT_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

  gsy-market-orchestrator:
    container_name: gsy-market-orchestrator
    build:
      context: .
      dockerfile: ./gsy-market-orchestrator/Dockerfile
    environment:
      - RUST_LOG=info,gsy_market_orchestrator=debug
      - EVM_NODE_URL=${EVM_NODE_URL:-ws://anvil:8545}
      - MARKET_CONTROLLER_ADDRESS=${MARKET_CONTROLLER_ADDRESS:-0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9}
      - ORCHESTRATOR_SIGNER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      - SPOT_MARKET_OPEN_OFFSET_MIN=-30
      - SPOT_MARKET_CLOSE_OFFSET_MIN=30
      - TICK_INTERVAL_SECONDS=5
      - LOOK_AHEAD_HOURS=1

  gsy-execution-engine:
    container_name: gsy-execution-engine
    build:
      context: .
      dockerfile: ./gsy-execution-engine/Dockerfile
    depends_on:
      gsy-offchain-storage:
        condition: service_started
    entrypoint: ["/usr/local/bin/gsy-execution-engine"]
    command: ["web3", "http://gsy-offchain-storage", "8080", "${EVM_NODE_HOST:-ws://anvil}", "${EVM_NODE_PORT:-8545}", "5", "900", "0.10"]
    environment:
      <<: *gsy-ewds-env
      OFFCHAIN_STORAGE_TRANSPORT: ${OFFCHAIN_STORAGE_TRANSPORT:-http}
      OFFCHAIN_STORAGE_URL: "http://gsy-offchain-storage:8080"
      EXECUTION_ENGINE_OFFSET_MIN: "-15"
      TRADE_SETTLEMENT_ADDRESS: ${TRADE_SETTLEMENT_ADDRESS:-0xa513E6E4b8f2a923D98304ec87F64353C4D5C853}
      EXECUTION_ENGINE_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
      EWDS_EXECUTION_ENGINE_CLIENT_ID: ${EWDS_EXECUTION_ENGINE_CLIENT_ID:-gsyexecutionengine}

  mongodb:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - ~/mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=gsy
      - MONGO_INITDB_ROOT_PASSWORD=gsy

  gsy-contracts:
    container_name: gsy-contracts
    build:
      context: ./gsy-contracts
      dockerfile: Dockerfile
    volumes:
      - ./gsy-contracts:/app
      - /app/node_modules
    command: tail -f /dev/null
