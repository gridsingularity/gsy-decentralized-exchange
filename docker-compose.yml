x-mongo-node: &mongo-node
  image: mongo:8.0
  command: ["mongod", "--replSet", "rs0", "--keyFile", "/keyfile/mongo-keyfile", "--bind_ip_all"]
  restart: unless-stopped
  depends_on:
    mongo-keyfile-init:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  gsy-node:
    container_name: gsy-node
    build:
      context: .
      dockerfile: ./gsy-node/Dockerfile
    ports:
      - "9944:9944"
      - "9933:9933"
    environment:
      - RUST_LOG=info
      - CARGO_HOME=/var/www/gsy-node/.cargo
      - OFFCHAIN_STORAGE_URL=http://gsy-offchain-storage:8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -H ''Content-Type: application/json'' -d ''{"id":1, "jsonrpc":"2.0", "method":"system_health"}'' http://localhost:9944 | grep -q ''"result":''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gsy-offchain-storage:
    container_name: gsy-offchain-storage
    build:
      context: .
      dockerfile: ./gsy-offchain-storage/Dockerfile
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - CARGO_HOME=/var/www/orderbook/.cargo
      - APPLICATION_HOST=0.0.0.0
      - APPLICATION_PORT=8080
      - DATABASE_NAME=orderbook
      - DATABASE_HOST=mongo1:27017,mongo2:27017,mongo3:27017
      - DATABASE_REPLICA_SET=rs0
      - DATABASE_AUTH_SOURCE=admin
      - DATABASE_URL_SCHEME=mongodb
      - DATABASE_USERNAME=gsy
      - DATABASE_PASSWORD=gsy
      - NODE_URL=gsy-node:9944
      - SCHEDULER_INTERVAL=900
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health_check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gsy-matching-engine:
    container_name: gsy-matching-engine
    build:
      dockerfile: ./gsy-matching-engine/Dockerfile
    depends_on:
      gsy-offchain-storage:
        condition: service_healthy
      gsy-node:
        condition: service_healthy
    working_dir: /var/www/matching-engine
    entrypoint: ["/usr/local/bin/gsy-matching-engine", "web3", "http://gsy-offchain-storage", "8080", "ws://gsy-node", "9944"]

  gsy-market-orchestrator:
    container_name: gsy-market-orchestrator
    build:
      dockerfile: ./gsy-market-orchestrator/Dockerfile
    depends_on:
      gsy-node:
        condition: service_healthy
      gsy-offchain-storage:
        condition: service_healthy
    environment:
      - RUST_LOG=info,gsy_market_orchestrator=debug
      - GSY_NODE_URL=ws://gsy-node:9944
      - ORCHESTRATOR_SIGNER_SURI=//Alice
      - OFFCHAIN_STORAGE_URL=http://gsy-offchain-storage:8080

  gsy-execution-engine:
    container_name: gsy-execution-engine
    build:
      dockerfile: ./gsy-execution-engine/Dockerfile
    depends_on:
      gsy-offchain-storage:
        condition: service_healthy
      gsy-node:
        condition: service_healthy
    working_dir: /var/www/execution-engine
    entrypoint: ["/usr/local/bin/gsy-execution-engine", "web3", "http://gsy-offchain-storage", "8080", "ws://gsy-node", "9944", "30", "3600", "0.10"]

  # --- MongoDB replica set (rs0), dev topology ---
  mongo-keyfile-init:
    image: mongo:8.0
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /keyfile/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 > /keyfile/mongo-keyfile
        fi
        chmod 400 /keyfile/mongo-keyfile
        chown 999:999 /keyfile/mongo-keyfile
    volumes:
      - mongo-keyfile:/keyfile
    restart: "no"

  mongo1:
    <<: *mongo-node
    container_name: mongo1
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=gsy
      - MONGO_INITDB_ROOT_PASSWORD=gsy
    volumes:
      - mongo1-data:/data/db
      - mongo-keyfile:/keyfile:ro

  mongo2:
    <<: *mongo-node
    container_name: mongo2
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
      - mongo-keyfile:/keyfile:ro

  mongo3:
    <<: *mongo-node
    container_name: mongo3
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
      - mongo-keyfile:/keyfile:ro

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    entrypoint: ["bash", "/mongo-rs-init.sh"]
    volumes:
      - ./deployment/mongodb-dev/mongo-rs-init.sh:/mongo-rs-init.sh:ro
    restart: "no"

volumes:
  mongo-keyfile:
  mongo1-data:
  mongo2-data:
  mongo3-data:
